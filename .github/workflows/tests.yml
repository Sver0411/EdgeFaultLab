name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate the shipped scenarios
        run: |
          for scenario in scenarios/*.json examples/smart_agriculture/*.json; do
            edgefaultlab validate "$scenario"
          done

      - name: Run the test suite
        run: pytest -q
